<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="meuBotao">Clique aqui
    </button>
    <form id="meuFormulario">
    
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">
       <label for="email">Email:</label>
       <input type="email" id="email" name="email">
       <label for="senha">Senha:</label>
       <input type="password" id="senha" name="senha">
       <button type="submit">Enviar</button>
       </form>

       <form id="num">
        <label for="num">Digite um número:</label>
        <input type="number" id="numero" name="num">
        <button type="submit">Enviar</button>
       </form>
         <script>
         const botao =
        document.getElementById('meuBotao');
         botao.addEventListener('click', function() {
         alert('Botão clicado');
         });
         const formulario = document.getElementById('meuFormulario');
         formulario.addEventListener('submit', function(evento) {
         evento.preventDefault(); // impede o envio do formulário
         const nome = document.getElementById('nome').value;
         const email = document.getElementById('email').value;
         const senha = document.getElementById('senha').value;

        if (nome === '' || email === '' || senha === '') {
            alert('Preencha todos os campos');
            return false;
        }
        // código para enviar os dados para o servidor
         });

         const botao1=document.getElementById('num');
         botao1.addEventListener('submit', function(evento){
            evento.preventDefault();
            const num= document.getElementById('numero').value;
            alert(num*2);
         }) ;
         let nome = prompt("Qual é o seu nome?");
         console.log("Olá, " + nome + "!");

         </script>
</body>
</html>
